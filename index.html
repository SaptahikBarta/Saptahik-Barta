<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>সাপ্তাহিক বার্তা</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="logo">
        <span>সাপ্তাহিক বার্তা</span>
    </div>

    <div class="header-right">
        <div class="search">⌕</div>
        <div class="login">👤 Login</div>
        <div class="menu-btn" onclick="openMenu()">☰</div>
    </div>

</header>


<!-- NAVIGATION -->
<nav class="top-nav">

    <a href="#">সর্বশেষ</a>
    <a href="#">বাংলাদেশ</a>
    <a href="#">রাজনীতি</a>
    <a href="#">বিশ্ব</a>
    <a href="#">ব্যবসা</a>
    <a href="#">খেলা</a>
    <a href="#">প্রযুক্তি</a>

</nav>


<!-- MOBILE MENU -->
<div id="mobileMenu" class="mobile-menu">

    <div class="menu-header">
        <b>সাপ্তাহিক বার্তা</b>
        <button onclick="closeMenu()">✕</button>
    </div>

    <div class="menu-grid">

        <a href="#">প্রচ্ছদ</a>
        <a href="#">সর্বশেষ</a>
        <a href="#">বিশেষ সংবাদ</a>

        <a href="#">রাজনীতি</a>
        <a href="#">দেশ</a>
        <a href="#">বিশ্ব</a>

        <a href="#">বাংলাদেশ</a>
        <a href="#">মতামত</a>
        <a href="#">বাণিজ্য</a>

        <a href="#">বিনোদন</a>
        <a href="#">জীবনযাপন</a>
        <a href="#">চাকরি</a>

        <a href="#">খেলা</a>
        <a href="#">প্রযুক্তি</a>
        <a href="#">শিক্ষা</a>

        <a href="#">ধর্ম</a>
        <a href="#">অন্যান্য</a>

    </div>

</div>


<!-- BREAKING NEWS -->
<section class="breaking-section">

    <div class="breaking-title">
        🔴 ব্রেকিং নিউজ
    </div>

    <div class="breaking-box">

        <div id="breakingNews" class="breaking-text">
            ব্রেকিং নিউজ আসছে...
        </div>

    </div>

</section>


<!-- MAIN CONTENT -->
<main class="container">

    <!-- সর্বশেষ -->
    <section class="latest-section">

        <div class="section-title">
            <span>সর্বশেষ</span>
            <div></div>
        </div>

        <div id="latestNews" class="news-list">

            <p class="loading">
                নিউজ লোড হচ্ছে...
            </p>

        </div>

    </section>

</main>


<!-- FIREBASE -->
<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    query,
    orderBy,
    limit,
    onSnapshot
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   আপনার Firebase Config
========================= */

const firebaseConfig = {

    apiKey: "আপনার_API_KEY",
    authDomain: "আপনার_PROJECT.firebaseapp.com",
    projectId: "আপনার_PROJECT_ID",
    storageBucket: "আপনার_PROJECT.appspot.com",
    messagingSenderId: "আপনার_SENDER_ID",
    appId: "আপনার_APP_ID"

};


/* Firebase শুরু */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   সর্বশেষ ১০টি নিউজ
========================= */

const latestQuery = query(

    collection(db, "news"),

    orderBy("createdAt", "desc"),

    limit(10)

);


onSnapshot(latestQuery, (snapshot) => {

    const latestBox =
        document.getElementById("latestNews");

    latestBox.innerHTML = "";

    if (snapshot.empty) {

        latestBox.innerHTML =
        `<p class="loading">এখনো কোনো নিউজ প্রকাশিত হয়নি।</p>`;

        return;
    }


    snapshot.forEach((doc) => {

        const news = doc.data();

        const title =
            news.title || "শিরোনাম নেই";

        const image =
            news.image ||
            "https://via.placeholder.com/500x300?text=Saptahik+Barta";

        let time = "";

        if (news.createdAt && news.createdAt.toDate) {

            const date = news.createdAt.toDate();

            time = date.toLocaleString("bn-BD", {

                day: "numeric",
                month: "long",
                hour: "numeric",
                minute: "2-digit"

            });

        }


        latestBox.innerHTML += `

        <article class="news-item">

            <div class="news-content">

                <div class="news-time">
                    ${time}
                </div>

                <h2>
                    ${title}
                </h2>

                ${
                    news.description
                    ?
                    `<p>${news.description}</p>`
                    :
                    ""
                }

            </div>

            <img
                src="${image}"
                alt="${title}"
                onerror="this.src='https://via.placeholder.com/500x300?text=News'"
            >

        </article>

        `;

    });

});


/* =========================
   BREAKING NEWS
   সর্বশেষ নিউজ থেকে প্রথমটি
========================= */

const breakingQuery = query(

    collection(db, "news"),

    orderBy("createdAt", "desc"),

    limit(1)

);


onSnapshot(breakingQuery, (snapshot) => {

    const box =
        document.getElementById("breakingNews");

    if (snapshot.empty) {

        box.textContent =
            "সাপ্তাহিক বার্তার ব্রেকিং নিউজ";

        return;

    }

    snapshot.forEach((doc) => {

        const news = doc.data();

        box.textContent =
            news.title || "ব্রেকিং নিউজ";

    });

});


/* MENU */

window.openMenu = function() {

    document
        .getElementById("mobileMenu")
        .classList.add("active");

};


window.closeMenu = function() {

    document
        .getElementById("mobileMenu")
        .classList.remove("active");

};

</script>

</body>
</html>
