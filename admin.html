<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - সাপ্তাহিক বার্তা</title>
<style>body{font-family:Arial,sans-serif;background:#f3f3f3;margin:0}.box{max-width:600px;margin:35px auto;background:#fff;padding:25px;box-shadow:0 2px 10px #ccc}h1{color:#c00}input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccc;box-sizing:border-box}button{background:#c00;color:#fff;border:0;padding:12px 18px;font-weight:bold}a{color:#c00}</style></head>
<body><div class="box"><h1>📰 সাপ্তাহিক বার্তা — Admin</h1>
<p><b>নোট:</b> এটি এখন একটি local/demo Admin panel। এখানে প্রকাশিত খবর এই ব্রাউজারের local storage-এ রাখা হবে; সবার জন্য online publication করতে পরে server/database লাগবে।</p>
<label>Admin Password</label><input id="pass" type="password" placeholder="Demo password: 1234"><button onclick="login()">Login</button>
<div id="panel" style="display:none"><hr><label>শিরোনাম</label><input id="title"><label>বিভাগ</label><select id="cat"><option>জাতীয়</option><option>রাজনীতি</option><option>আন্তর্জাতিক</option><option>অর্থনীতি</option><option>খেলাধুলা</option><option>বিজ্ঞান ও প্রযুক্তি</option></select><label>ছবির URL</label><input id="img" placeholder="https://..."><label>সংবাদের বিস্তারিত</label><textarea id="body" rows="8"></textarea><button onclick="publish()">সংবাদ প্রকাশ করুন</button><p id="msg"></p></div>
<p><a href="index.html">← Website-এ ফিরে যান</a></p></div>
<script>
function login(){if(document.getElementById('pass').value==='1234'){document.getElementById('panel').style.display='block';alert('Login সফল');}else alert('Password ভুল');}
function publish(){let p={title:title.value,cat:cat.value,img:img.value,body:body.value,date:new Date().toLocaleString('bn-BD')};let a=JSON.parse(localStorage.getItem('news')||'[]');a.unshift(p);localStorage.setItem('news',JSON.stringify(a));document.getElementById('msg').textContent='সংবাদটি এই ডিভাইসের local storage-এ সংরক্ষণ হয়েছে।';}
</script></body></html>
