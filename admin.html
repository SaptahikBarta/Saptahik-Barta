<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin - সাপ্তাহিক বার্তা</title><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;

    font-family:
    Arial,
    "Noto Sans Bengali",
    sans-serif;

    background:#f3f3f3;
}

.box{
    max-width:700px;

    margin:25px auto;

    background:#fff;

    padding:22px;

    box-shadow:
    0 2px 10px #ccc;
}

h1{
    color:#c00;
}

input,
textarea,
select{

    width:100%;

    padding:12px;

    margin:7px 0 14px;

    border:1px solid #ccc;

    border-radius:4px;
}

button{

    background:#c00;

    color:#fff;

    border:0;

    padding:11px 17px;

    font-weight:bold;

    cursor:pointer;

    border-radius:4px;
}

button:hover{
    opacity:.85;
}

.secondary{
    background:#333;
}

.edit{
    background:#075fc9;
}

.delete{
    background:#900;
}

.logout{
    background:#555;

    float:right;
}

.newsItem{

    border:1px solid #ddd;

    margin-top:15px;

    padding:15px;

    background:#fafafa;
}

.newsItem img{

    width:120px;

    height:80px;

    object-fit:cover;

    float:left;

    margin-right:12px;
}

.newsItem h3{
    margin:0 0 7px;
}

.date{
    color:#777;

    font-size:13px;

    margin:6px 0;
}

.clear{
    clear:both;
}

#panel{
    display:none;
}

#message{

    margin:15px 0;

    font-weight:bold;
}

#previewImage{

    max-width:100%;

    max-height:300px;

    display:none;

    margin-top:10px;
}

.uploadInfo{

    font-size:13px;

    color:#666;

    line-height:1.7;

    margin-bottom:10px;
}

@media(max-width:600px){

    .box{

        margin:0;

        min-height:100vh;

        padding:15px;
    }

    .newsItem img{

        width:100%;

        height:180px;

        float:none;

        margin:0 0 10px;
    }

}

</style></head><body><div class="box"><h1>
📰 সাপ্তাহিক বার্তা — Admin
</h1><!-- LOGIN --><div id="loginBox"><p>
Admin Email দিয়ে Login করুন।
</p><label>
Email
</label><input
id="email"
type="email"
placeholder="Admin email">

<label>
Password
</label><input
id="password"
type="password"
placeholder="Password">

<button id="loginBtn">
Login
</button><p id="loginMessage"></p></div><!-- ADMIN PANEL --><div id="panel"><button
class="logout"
id="logoutBtn">

Logout

</button><div style="clear:both"></div><hr><h2 id="formTitle">
নতুন সংবাদ প্রকাশ
</h2><label>
শিরোনাম
</label><input
id="title"
type="text"
placeholder="সংবাদের শিরোনাম লিখুন">

<label>
বিভাগ
</label><select id="cat"><option>জাতীয়</option><option>রাজনীতি</option><option>আন্তর্জাতিক</option><option>অর্থনীতি</option><option>খেলাধুলা</option><option>বিজ্ঞান ও প্রযুক্তি</option><option>মতামত</option></select><!-- IMAGE --><label>
🖼️ সংবাদ ছবি
</label><input
id="imageFile"
type="file"
accept="image/*">

<div class="uploadInfo">মোবাইল থেকে Gallery/Photos থেকে ছবি নির্বাচন করুন।

<br>ছবি স্বয়ংক্রিয়ভাবে ছোট করে সংরক্ষণ করা হবে।

</div><img
id="previewImage"
alt="ছবির Preview">

<label>
সংবাদের বিস্তারিত
</label><textarea
id="body"
rows="10"
placeholder="সম্পূর্ণ সংবাদ লিখুন">
</textarea><label>
Breaking News?
</label><select id="breaking"><option value="false">
না
</option><option value="true">
হ্যাঁ
</option></select><br><br>

<button id="publishBtn">
সংবাদ প্রকাশ করুন
</button><button
id="cancelBtn"
class="secondary"
style="display:none">

Edit বাতিল

</button><p id="message"></p><hr><h2>
📰 প্রকাশিত সংবাদ
</h2><div id="newsList">
নিউজ লোড হচ্ছে...
</div></div><p><a href="index.html">
← Website-এ ফিরে যান
</a></p></div><script type="module">


/* FIREBASE */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


/* AUTH */

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* FIRESTORE */

import {
    getFirestore,
    collection,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* CONFIG */

const firebaseConfig = {

    apiKey:
    "AIzaSyDugMsCaCtCZwKzBHhYQJbgsySRwA6ikXg",

    authDomain:
    "saptahik-barta.firebaseapp.com",

    projectId:
    "saptahik-barta",

    storageBucket:
    "saptahik-barta.firebasestorage.app",

    messagingSenderId:
    "64482849817",

    appId:
    "1:64482849817:web:67af4e2b46d9bf2b7f2688",

    measurementId:
    "G-L100GNJ7JM"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


/* VARIABLES */

let editingId =
null;

let selectedImageData =
"";


/* ELEMENTS */

const loginBox =
document.getElementById(
    "loginBox"
);

const panel =
document.getElementById(
    "panel"
);

const loginMessage =
document.getElementById(
    "loginMessage"
);

const message =
document.getElementById(
    "message"
);


/* IMAGE SELECT */

document.getElementById(
    "imageFile"
).addEventListener(
    "change",
    function(){

        const file =
        this.files[0];


        if(!file)
            return;


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            alert(
                "শুধু ছবি নির্বাচন করুন।"
            );

            return;

        }


        const reader =
        new FileReader();


        reader.onload =
        function(event){

            const img =
            new Image();


            img.onload =
            function(){

                const canvas =
                document.createElement(
                    "canvas"
                );


                const maxWidth =
                1000;


                let width =
                img.width;

                let height =
                img.height;


                if(
                    width >
                    maxWidth
                ){

                    height =
                    height *
                    maxWidth /
                    width;

                    width =
                    maxWidth;

                }


                canvas.width =
                width;

                canvas.height =
                height;


                const ctx =
                canvas.getContext(
                    "2d"
                );


                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                selectedImageData =
                canvas.toDataURL(
                    "image/jpeg",
                    0.60
                );


                const preview =
                document.getElementById(
                    "previewImage"
                );


                preview.src =
                selectedImageData;


                preview.style.display =
                "block";

            };


            img.src =
            event.target.result;

        };


        reader.readAsDataURL(file);

    }
);


/* LOGIN */

document.getElementById(
    "loginBtn"
).onclick =
async function(){

    const email =
    document.getElementById(
        "email"
    ).value.trim();


    const password =
    document.getElementById(
        "password"
    ).value;


    if(
        !email ||
        !password
    ){

        loginMessage.textContent =
        "Email ও Password দিন।";

        return;

    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        loginMessage.textContent =
        "";

    }

    catch(error){

        console.error(error);

        loginMessage.textContent =
        "Login ব্যর্থ হয়েছে। Email/Password পরীক্ষা করুন।";

    }

};


/* LOGOUT */

document.getElementById(
    "logoutBtn"
).onclick =
function(){

    signOut(auth);

};


/* AUTH STATE */

onAuthStateChanged(
    auth,
    user => {

        if(user){

            loginBox.style.display =
            "none";

            panel.style.display =
            "block";

        }

        else{

            loginBox.style.display =
            "block";

            panel.style.display =
            "none";

        }

    }
);


/* PUBLISH */

document.getElementById(
    "publishBtn"
).onclick =
async function(){

    const title =
    document.getElementById(
        "title"
    ).value.trim();


    const cat =
    document.getElementById(
        "cat"
    ).value;


    const body =
    document.getElementById(
        "body"
    ).value.trim();


    const breaking =
    document.getElementById(
        "breaking"
    ).value === "true";


    if(
        !title ||
        !body
    ){

        message.textContent =
        "শিরোনাম ও বিস্তারিত সংবাদ লিখুন।";

        return;

    }


    if(
        selectedImageData &&
        selectedImageData.length >
        900000
    ){

        message.textContent =
        "ছবিটি অনেক বড়। অন্য ছবি নির্বাচন করুন।";

        return;

    }


    message.textContent =
    "⏳ সংবাদ সংরক্ষণ হচ্ছে...";


    try{


        if(editingId){

            const updateData = {

                title:title,

                cat:cat,

                body:body,

                breaking:breaking,

                updatedAt:
                serverTimestamp()

            };


            if(selectedImageData){

                updateData.img =
                selectedImageData;

            }


            await updateDoc(

                doc(
                    db,
                    "news",
                    editingId
                ),

                updateData

            );


            message.textContent =
            "✅ সংবাদ সফলভাবে Edit হয়েছে।";


            editingId =
            null;


            document.getElementById(
                "formTitle"
            ).textContent =
            "নতুন সংবাদ প্রকাশ";


            document.getElementById(
                "publishBtn"
            ).textContent =
            "সংবাদ প্রকাশ করুন";


            document.getElementById(
                "cancelBtn"
            ).style.display =
            "none";

        }

        else{

            await addDoc(

                collection(
                    db,
                    "news"
                ),

                {

                    title:title,

                    cat:cat,

                    img:
                    selectedImageData || "",

                    body:body,

                    breaking:breaking,

                    createdAt:
                    serverTimestamp(),

                    updatedAt:
                    serverTimestamp()

                }

            );


            message.textContent =
            "✅ সংবাদ সফলভাবে প্রকাশ হয়েছে।";

        }


        clearForm();

    }

    catch(error){

        console.error(error);

        message.textContent =
        "❌ সংবাদ সংরক্ষণ করা যায়নি।";

    }

};


/* CLEAR */

function clearForm(){

    document.getElementById(
        "title"
    ).value = "";


    document.getElementById(
        "body"
    ).value = "";


    document.getElementById(
        "breaking"
    ).value =
    "false";


    document.getElementById(
        "imageFile"
    ).value = "";


    selectedImageData =
    "";


    document.getElementById(
        "previewImage"
    ).style.display =
    "none";

}


/* CANCEL EDIT */

document.getElementById(
    "cancelBtn"
).onclick =
function(){

    editingId =
    null;


    clearForm();


    document.getElementById(
        "formTitle"
    ).textContent =
    "নতুন সংবাদ প্রকাশ";


    document.getElementById(
        "publishBtn"
    ).textContent =
    "সংবাদ প্রকাশ করুন";


    this.style.display =
    "none";

};


/* LOAD NEWS */

const newsQuery =
query(
    collection(db,"news"),
    orderBy(
        "createdAt",
        "desc"
    )
);


onSnapshot(

    newsQuery,

    snapshot => {

        const list =
        document.getElementById(
            "newsList"
        );


        list.innerHTML =
        "";


        if(snapshot.empty){

            list.innerHTML =
            "<p>এখনো কোনো সংবাদ প্রকাশ হয়নি।</p>";

            return;

        }


        snapshot.forEach(
            item => {

                const news =
                item.data();


                const div =
                document.createElement(
                    "div"
                );


                div.className =
                "newsItem";


                let date =
                "";


                if(news.createdAt){

                    date =
                    news.createdAt
                    .toDate()
                    .toLocaleString(
                        "bn-BD",
                        {
                            dateStyle:
                            "full",

                            timeStyle:
                            "short"
                        }
                    );

                }


                div.innerHTML = `

                    ${
                        news.img
                        ?
                        `<img
                            src="${escapeHtml(news.img)}"
                            alt="সংবাদ">`
                        :
                        ""
                    }


                    <h3>
                        ${escapeHtml(news.title || "")}
                    </h3>


                    <div class="date">
                        প্রকাশ:
                        ${date}
                    </div>


                    <div>
                        বিভাগ:
                        ${escapeHtml(news.cat || "")}
                    </div>


                    ${
                        news.breaking
                        ?
                        `<b style="color:red">
                            ⚡ Breaking News
                        </b>`
                        :
                        ""
                    }


                    <div class="clear"></div>

                    <br>


                    <button
                        class="edit"
                        onclick="editNews('${item.id}')">

                        ✏️ Edit

                    </button>


                    <button
                        class="delete"
                        onclick="deleteNews('${item.id}')">

                        🗑️ Delete

                    </button>

                `;


                list.appendChild(div);

            }
        );

    },


    error => {

        console.error(error);

        document.getElementById(
            "newsList"
        ).innerHTML =
        "<p>নিউজ লোড করা যাচ্ছে না। Firestore Rules পরীক্ষা করুন।</p>";

    }

);


/* EDIT */

window.editNews =
async function(id){

    const news =
    await getNewsData(id);


    if(!news)
        return;


    editingId =
    id;


    document.getElementById(
        "title"
    ).value =
    news.title || "";


    document.getElementById(
        "cat"
    ).value =
    news.cat || "জাতীয়";


    document.getElementById(
        "body"
    ).value =
    news.body || "";


    document.getElementById(
        "breaking"
    ).value =
    news.breaking
    ? "true"
    : "false";


    selectedImageData =
    news.img || "";


    if(news.img){

        const preview =
        document.getElementById(
            "previewImage"
        );


        preview.src =
        news.img;


        preview.style.display =
        "block";

    }


    document.getElementById(
        "formTitle"
    ).textContent =
    "✏️ সংবাদ Edit করুন";


    document.getElementById(
        "publishBtn"
    ).textContent =
    "Update করুন";


    document.getElementById(
        "cancelBtn"
    ).style.display =
    "inline-block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

};


/* GET NEWS */

async function getNewsData(id){

    return new Promise(
        resolve => {

            const unsubscribe =
            onSnapshot(

                doc(
                    db,
                    "news",
                    id
                ),

                snap => {

                    unsubscribe();


                    if(
                        snap.exists()
                    ){

                        resolve(
                            snap.data()
                        );

                    }

                    else{

                        resolve(null);

                    }

                }

            );

        }
    );

}


/* DELETE */

window.deleteNews =
async function(id){

    if(
        !confirm(
            "এই সংবাদটি Delete করতে চান?"
        )
    ){

        return;

    }


    try{

        await deleteDoc(

            doc(
                db,
                "news",
                id
            )

        );


        message.textContent =
        "🗑️ সংবাদ Delete হয়েছে।";

    }

    catch(error){

        console.error(error);

        message.textContent =
        "Delete করা যায়নি।";

    }

};


/* SECURITY */

function escapeHtml(text){

    const div =
    document.createElement(
        "div"
    );


    div.textContent =
    text == null
    ? ""
    : text;


    return div.innerHTML;

}

</script></body>
</html>
